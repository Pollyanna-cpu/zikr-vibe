name: zikr_vibe
description: Count your dhikr. Nothing else watches.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.0

  # Local storage — ObjectBox (crash-safe, WAL, 0.1ms/write)
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  # Note: ObjectBox requires native compilation, doesn't support web.
  # Keep Hive for web dev/testing. Use ObjectBox for iOS/Android release.
  # Migration will happen when building for mobile.

  # HTTP
  http: ^1.2.1

  # Auth
  sign_in_with_apple: ^6.1.0
  google_sign_in: ^6.2.1
  crypto: ^3.0.3

  # Firebase — add back when config files are ready:
  #   Android: android/app/google-services.json
  #   iOS: ios/Runner/GoogleService-Info.plist
  #   Dart: lib/firebase_options.dart (via flutterfire configure)
  # firebase_core: ^3.1.0
  # firebase_messaging: ^15.0.0
  # firebase_crashlytics: ^4.0.0

  # Deep linking
  app_links: ^6.3.2

  # UI
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Location & Sensors
  geolocator: ^12.0.0
  flutter_compass: ^0.8.0
  geocoding: ^3.0.0

  # Prayer times (offline calculation, 12 methods)
  adhan_dart: ^1.2.0

  # Screen awake during counting
  wakelock_plus: ^1.2.8

  # Notifications (local — zero server dependency)
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4

  # Sharing
  share_plus: ^9.0.0

  # Utils
  intl: ^0.20.2
  uuid: ^4.4.0
  url_launcher: ^6.3.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  adaptive_icon_background: "#0A4D38"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"

flutter_native_splash:
  color: "#0A4D38"
  image: "assets/icons/app_icon.png"
  android_12:
    color: "#0A4D38"
    image: "assets/icons/app_icon_foreground.png"

flutter:
  uses-material-design: true
  generate: true
  # assets:
  #   - assets/icons/
  #   - assets/patterns/
  #   - assets/fonts/
